  <title>Termitta</title>
  <!-- Monochrome: body takes currentColor, prompt is knocked out white.
       Recolour by setting `color` on the parent. -->
  <!--
    Vector master for the Termitta mascot.

    Traced from termitta-master.png with potrace, then coloured with the
    palette the branding README declares as the design intent:
      body   #D900B5   (the raster had drifted to ~#E603A9, and was not flat)
      prompt #39FF14

    Two flat fills, no gradients, and no anti-aliased chroma edges — the blue
    fringe left by the background removal in the raster is gone because the
    geometry is now geometry.

    The outer group maps potrace's 940-unit, y-flipped space into a 0..128
    viewBox, so this file can be edited or re-exported at any size.
  -->
