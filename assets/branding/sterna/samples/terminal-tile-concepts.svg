<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 2240 1700" width="2240" height="1700" role="img"
     aria-labelledby="title description">
  <title id="title">Sterna terminal tile concepts</title>
  <desc id="description">Six dark terminal tile concepts with large and small size previews.</desc>

  <defs>
    <g id="tern-shape" fill="currentColor">
      <path d="M10585 5604c-16-2-79-9-140-15-289-28-711-120-1005-218-780-260-1415-685-1825-1221l-65-85 153-5c135-5 238-22 237-39-1-3-39-31-87-61-365-233-454-369-584-884-85-340-172-567-298-778-256-430-674-774-1161-957-58-21-106-38-108-36-2 2 23 56 56 121 229 458 388 947 443 1361 7 51 11 95 8 97-19 20-597 49-799 41-1871-75-3631-763-5072-1983-82-69-146-127-145-129 2-2 124 56 272 127 772 377 1360 610 1975 784 1328 376 2542 378 3090 6 32-22 62-45 65-50 13-21-182-305-379-550-192-240-301-359-731-800l-140-144 80 44c141 76 639 372 955 567 46 28 86 50 88 48 4-4-144-295-239-470l-43-80 39 29c248 184 930 784 1269 1116 452 443 637 688 1106 1470 438 731 706 1088 1106 1480 519 508 1088 859 1891 1170 128 49 128 49 73 48-30-1-68-3-85-4z"/>
      <path d="M6880 4124c-305-80-544-406-649-885l-18-86 191 192c357 359 630 515 902 515h53l-6 68c-7 82-33 114-128 161-104 52-233 65-345 35z"/>
    </g>

    <path id="tern-beak"
          d="M7520 3993c-19-2-53-5-75-8l-40-5v-115c0-63 2-115 4-115 3 0 12 6 20 14 9 7 97 59 196 116 99 56 184 106 190 111 8 8-213 10-295 2z"/>

    <g id="light-tern">
      <g transform="translate(544 544) scale(.82) translate(-544 -544)">
        <g transform="translate(544 544) scale(1.18) rotate(-20) translate(-544 -544)">
          <g transform="translate(0 254)">
            <g transform="translate(0 580) scale(.1 -.1)">
              <use xlink:href="#tern-shape" color="#F8F7F2"/>
              <use xlink:href="#tern-beak" fill="#F99E2A"/>
            </g>
          </g>
        </g>
      </g>
    </g>

    <g id="light-tern-no-beak">
      <g transform="translate(544 544) scale(.82) translate(-544 -544)">
        <g transform="translate(544 544) scale(1.18) rotate(-20) translate(-544 -544)">
          <g transform="translate(0 254)">
            <g transform="translate(0 580) scale(.1 -.1)">
              <use xlink:href="#tern-shape" color="#F8F7F2"/>
            </g>
          </g>
        </g>
      </g>
    </g>

    <symbol id="tile-minimal" viewBox="0 0 1088 1088">
      <rect width="1088" height="1088" rx="190" fill="#1B1D1F"/>
      <use xlink:href="#light-tern"/>
    </symbol>

    <symbol id="tile-corner-prompt" viewBox="0 0 1088 1088">
      <rect width="1088" height="1088" rx="190" fill="#1B1D1F"/>
      <use xlink:href="#light-tern"/>
      <path d="m752 792 42 24-42 24" fill="none" stroke="#F8F7F2" stroke-width="18"
            stroke-linecap="square" stroke-linejoin="miter"/>
      <rect x="818" y="830" width="54" height="22" rx="3" fill="#F99E2A"/>
    </symbol>

    <symbol id="tile-beak-prompt" viewBox="0 0 1088 1088">
      <rect width="1088" height="1088" rx="190" fill="#1B1D1F"/>
      <use xlink:href="#light-tern-no-beak"/>
      <path d="m680 354 48 24-48 24" fill="none" stroke="#F99E2A" stroke-width="22"
            stroke-linecap="square" stroke-linejoin="miter"/>
      <rect x="744" y="396" width="58" height="20" rx="3" fill="#F99E2A"/>
    </symbol>

    <symbol id="tile-terminal-rows" viewBox="0 0 1088 1088">
      <rect width="1088" height="1088" rx="190" fill="#1B1D1F"/>
      <use xlink:href="#light-tern"/>
      <g fill="#6D7175" opacity=".72">
        <rect x="712" y="704" width="174" height="18" rx="4"/>
        <rect x="744" y="748" width="142" height="18" rx="4"/>
        <rect x="712" y="792" width="96" height="18" rx="4"/>
      </g>
      <rect x="828" y="787" width="50" height="28" rx="4" fill="#F99E2A"/>
    </symbol>

    <symbol id="tile-screen-frame" viewBox="0 0 1088 1088">
      <rect width="1088" height="1088" rx="190" fill="#1B1D1F"/>
      <rect x="72" y="72" width="944" height="944" rx="134" fill="none"
            stroke="#F8F7F2" stroke-width="16" opacity=".24"/>
      <path d="M80 212h928" stroke="#F8F7F2" stroke-width="16" opacity=".24"/>
      <circle cx="142" cy="143" r="18" fill="#F99E2A"/>
      <circle cx="198" cy="143" r="18" fill="#F8F7F2" opacity=".38"/>
      <circle cx="254" cy="143" r="18" fill="#F8F7F2" opacity=".38"/>
      <g transform="translate(544 594) scale(.77) translate(-544 -544)">
        <use xlink:href="#light-tern"/>
      </g>
    </symbol>

    <symbol id="tile-phosphor" viewBox="0 0 1088 1088">
      <rect width="1088" height="1088" rx="190" fill="#07130D"/>
      <g transform="translate(544 544) scale(.82) translate(-544 -544)">
        <g transform="translate(544 544) scale(1.18) rotate(-20) translate(-544 -544)">
          <g transform="translate(0 254)">
            <g transform="translate(0 580) scale(.1 -.1)">
              <use xlink:href="#tern-shape" color="#7BE6A3"/>
              <use xlink:href="#tern-beak" fill="#F99E2A"/>
            </g>
          </g>
        </g>
      </g>
      <path d="m752 792 42 24-42 24" fill="none" stroke="#7BE6A3" stroke-width="18"
            stroke-linecap="square" stroke-linejoin="miter"/>
      <rect x="818" y="830" width="54" height="22" rx="3" fill="#F99E2A"/>
    </symbol>
  </defs>

  <rect width="2240" height="1700" fill="#EAE8E1"/>
  <text x="80" y="82" fill="#28292A" font-family="sans-serif" font-size="46" font-weight="700">
    Sterna terminal tile exploration
  </text>
  <text x="80" y="124" fill="#5C5D5E" font-family="sans-serif" font-size="24">
    Each concept uses the current bird geometry.
  </text>

  <g font-family="sans-serif" text-anchor="middle">
    <g transform="translate(80 170)">
      <use xlink:href="#tile-minimal" x="24" width="432" height="432"/>
      <text x="240" y="480" fill="#28292A" font-size="30" font-weight="700">Minimal</text>
      <text x="240" y="516" fill="#5C5D5E" font-size="22">Only the tile color changes</text>
      <use xlink:href="#tile-minimal" x="120" y="560" width="64" height="64"/>
      <use xlink:href="#tile-minimal" x="226" y="576" width="32" height="32"/>
      <use xlink:href="#tile-minimal" x="304" y="584" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18">
        <text x="152" y="654">64</text><text x="242" y="654">32</text><text x="312" y="654">16</text>
      </g>
    </g>

    <g transform="translate(790 170)">
      <use xlink:href="#tile-corner-prompt" x="24" width="432" height="432"/>
      <text x="240" y="480" fill="#28292A" font-size="30" font-weight="700">Corner prompt</text>
      <text x="240" y="516" fill="#5C5D5E" font-size="22">The prompt stays separate</text>
      <use xlink:href="#tile-corner-prompt" x="120" y="560" width="64" height="64"/>
      <use xlink:href="#tile-corner-prompt" x="226" y="576" width="32" height="32"/>
      <use xlink:href="#tile-corner-prompt" x="304" y="584" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18">
        <text x="152" y="654">64</text><text x="242" y="654">32</text><text x="312" y="654">16</text>
      </g>
    </g>

    <g transform="translate(1500 170)">
      <use xlink:href="#tile-beak-prompt" x="24" width="432" height="432"/>
      <text x="240" y="480" fill="#28292A" font-size="30" font-weight="700">Beak prompt</text>
      <text x="240" y="516" fill="#5C5D5E" font-size="22">The prompt joins the bird</text>
      <use xlink:href="#tile-beak-prompt" x="120" y="560" width="64" height="64"/>
      <use xlink:href="#tile-beak-prompt" x="226" y="576" width="32" height="32"/>
      <use xlink:href="#tile-beak-prompt" x="304" y="584" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18">
        <text x="152" y="654">64</text><text x="242" y="654">32</text><text x="312" y="654">16</text>
      </g>
    </g>

    <g transform="translate(80 910)">
      <use xlink:href="#tile-terminal-rows" x="24" width="432" height="432"/>
      <text x="240" y="480" fill="#28292A" font-size="30" font-weight="700">Terminal rows</text>
      <text x="240" y="516" fill="#5C5D5E" font-size="22">Muted rows support the cursor</text>
      <use xlink:href="#tile-terminal-rows" x="120" y="560" width="64" height="64"/>
      <use xlink:href="#tile-terminal-rows" x="226" y="576" width="32" height="32"/>
      <use xlink:href="#tile-terminal-rows" x="304" y="584" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18">
        <text x="152" y="654">64</text><text x="242" y="654">32</text><text x="312" y="654">16</text>
      </g>
    </g>

    <g transform="translate(790 910)">
      <use xlink:href="#tile-screen-frame" x="24" width="432" height="432"/>
      <text x="240" y="480" fill="#28292A" font-size="30" font-weight="700">Screen frame</text>
      <text x="240" y="516" fill="#5C5D5E" font-size="22">A frame makes the screen explicit</text>
      <use xlink:href="#tile-screen-frame" x="120" y="560" width="64" height="64"/>
      <use xlink:href="#tile-screen-frame" x="226" y="576" width="32" height="32"/>
      <use xlink:href="#tile-screen-frame" x="304" y="584" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18">
        <text x="152" y="654">64</text><text x="242" y="654">32</text><text x="312" y="654">16</text>
      </g>
    </g>

    <g transform="translate(1500 910)">
      <use xlink:href="#tile-phosphor" x="24" width="432" height="432"/>
      <text x="240" y="480" fill="#28292A" font-size="30" font-weight="700">Phosphor green</text>
      <text x="240" y="516" fill="#5C5D5E" font-size="22">Color supplies the terminal cue</text>
      <use xlink:href="#tile-phosphor" x="120" y="560" width="64" height="64"/>
      <use xlink:href="#tile-phosphor" x="226" y="576" width="32" height="32"/>
      <use xlink:href="#tile-phosphor" x="304" y="584" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18">
        <text x="152" y="654">64</text><text x="242" y="654">32</text><text x="312" y="654">16</text>
      </g>
    </g>
  </g>
</svg>
