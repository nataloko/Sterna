      <use xlink:href="#concept-prompt" x="226" y="886" width="32" height="32"/>
      <use xlink:href="#concept-prompt" x="304" y="894" width="16" height="16"/>

      <use xlink:href="#concept-feathers" x="660" y="870" width="64" height="64"/>
      <use xlink:href="#concept-feathers" x="766" y="886" width="32" height="32"/>
      <use xlink:href="#concept-feathers" x="844" y="894" width="16" height="16"/>

      <use xlink:href="#concept-data" x="1200" y="870" width="64" height="64"/>
      <use xlink:href="#concept-data" x="1306" y="886" width="32" height="32"/>
      <use xlink:href="#concept-data" x="1384" y="894" width="16" height="16"/>

      <use xlink:href="#concept-dark" x="1740" y="870" width="64" height="64"/>
      <use xlink:href="#concept-dark" x="1846" y="886" width="32" height="32"/>
      <use xlink:href="#concept-dark" x="1924" y="894" width="16" height="16"/>
    </g>
