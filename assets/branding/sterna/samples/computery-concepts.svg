  </text>
  <text x="80" y="124" fill="#5C5D5E" font-family="sans-serif" font-size="24">
    Each concept uses the current bird geometry.
  </text>

  <g font-family="sans-serif" text-anchor="middle">
    <g transform="translate(80 170)">
      <rect width="480" height="480" rx="58" fill="#FFFFFF" opacity=".62"/>
      <use xlink:href="#concept-prompt" x="24" y="24" width="432" height="432"/>
      <text x="240" y="536" fill="#28292A" font-size="30" font-weight="700">Beak prompt</text>
      <text x="240" y="572" fill="#5C5D5E" font-size="22">The beak becomes &gt;_</text>
    </g>

    <g transform="translate(620 170)">
      <rect width="480" height="480" rx="58" fill="#FFFFFF" opacity=".62"/>
      <use xlink:href="#concept-feathers" x="24" y="24" width="432" height="432"/>
      <text x="240" y="536" fill="#28292A" font-size="30" font-weight="700">Pixel feathers</text>
      <text x="240" y="572" fill="#5C5D5E" font-size="22">Three terminal-line cuts</text>
