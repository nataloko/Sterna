      <use xlink:href="#concept-data" x="24" y="24" width="432" height="432"/>
      <text x="240" y="536" fill="#28292A" font-size="30" font-weight="700">Data trail</text>
      <text x="240" y="572" fill="#5C5D5E" font-size="22">Three transmitted blocks</text>
    </g>

    <g transform="translate(1700 170)">
      <rect width="480" height="480" rx="58" fill="#FFFFFF" opacity=".62"/>
      <use xlink:href="#concept-dark" x="24" y="24" width="432" height="432"/>
      <text x="240" y="536" fill="#28292A" font-size="30" font-weight="700">Dark terminal tile</text>
      <text x="240" y="572" fill="#5C5D5E" font-size="22">Light bird and block cursor</text>
    </g>

    <g fill="#5C5D5E" font-size="18">
      <text x="80" y="855" text-anchor="start">Small-size previews</text>
      <text x="152" y="965">64</text>
      <text x="242" y="965">32</text>
      <text x="312" y="965">16</text>
      <text x="692" y="965">64</text>
      <text x="782" y="965">32</text>
      <text x="852" y="965">16</text>
      <text x="1232" y="965">64</text>
      <text x="1322" y="965">32</text>
      <text x="1392" y="965">16</text>
      <text x="1772" y="965">64</text>
      <text x="1862" y="965">32</text>
      <text x="1932" y="965">16</text>
    </g>

    <g>
