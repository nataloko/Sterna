    <g id="bird-shield">
      <g transform="translate(544 544) scale(.82) translate(-544 -544)">
        <g transform="translate(544 544) scale(1.18) rotate(-20) translate(-544 -544)">
          <g transform="translate(0 254)">
            <g transform="translate(0 580) scale(.1 -.1)">
              <use xlink:href="#tern-shape" fill="#03110A" stroke="#03110A" stroke-width="900"
                   stroke-linejoin="round"/>
              <use xlink:href="#tern-beak" fill="#03110A" stroke="#03110A" stroke-width="900"
                   stroke-linejoin="round"/>
            </g>
          </g>
        </g>
      </g>
    </g>

    <path id="bird-body-mask"
