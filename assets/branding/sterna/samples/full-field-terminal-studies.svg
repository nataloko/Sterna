          fill="#03110A" stroke="#03110A" stroke-width="42" stroke-linejoin="round"/>

    <g id="wire-tern">
      <g transform="translate(544 544) scale(.82) translate(-544 -544)">
        <g transform="translate(544 544) scale(1.18) rotate(-20) translate(-544 -544)">
          <g transform="translate(0 254)">
            <g transform="translate(0 580) scale(.1 -.1)">
              <use xlink:href="#tern-shape" fill="none" stroke="#73F59B" stroke-width="180"
                   stroke-linejoin="round"/>
              <use xlink:href="#tern-beak" fill="#F99E2A"/>
            </g>
          </g>
        </g>
      </g>
    </g>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <g id="bird-on-top">
      <use xlink:href="#bird-body-mask"/>
      <use xlink:href="#bird-shield"/>
      <g filter="url(#glow)"><use xlink:href="#wire-tern"/></g>
    </g>

