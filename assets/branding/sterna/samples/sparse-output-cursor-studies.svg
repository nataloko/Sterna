<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 2240 1700" width="2240" height="1700" role="img"
     aria-labelledby="title description">
  <title id="title">Sterna sparse-output cursor studies</title>
  <desc id="description">Six cursor and bird treatments with sparse terminal rows.</desc>

  <defs>
    <g id="tern-shape">
      <path d="M10585 5604c-16-2-79-9-140-15-289-28-711-120-1005-218-780-260-1415-685-1825-1221l-65-85 153-5c135-5 238-22 237-39-1-3-39-31-87-61-365-233-454-369-584-884-85-340-172-567-298-778-256-430-674-774-1161-957-58-21-106-38-108-36-2 2 23 56 56 121 229 458 388 947 443 1361 7 51 11 95 8 97-19 20-597 49-799 41-1871-75-3631-763-5072-1983-82-69-146-127-145-129 2-2 124 56 272 127 772 377 1360 610 1975 784 1328 376 2542 378 3090 6 32-22 62-45 65-50 13-21-182-305-379-550-192-240-301-359-731-800l-140-144 80 44c141 76 639 372 955 567 46 28 86 50 88 48 4-4-144-295-239-470l-43-80 39 29c248 184 930 784 1269 1116 452 443 637 688 1106 1470 438 731 706 1088 1106 1480 519 508 1088 859 1891 1170 128 49 128 49 73 48-30-1-68-3-85-4z"/>
      <path d="M6880 4124c-305-80-544-406-649-885l-18-86 191 192c357 359 630 515 902 515h53l-6 68c-7 82-33 114-128 161-104 52-233 65-345 35z"/>
    </g>

    <path id="tern-beak"
          d="M7520 3993c-19-2-53-5-75-8l-40-5v-115c0-63 2-115 4-115 3 0 12 6 20 14 9 7 97 59 196 116 99 56 184 106 190 111 8 8-213 10-295 2z"/>

    <g id="bird-shield">
      <g transform="translate(544 544) scale(.82) translate(-544 -544)">
        <g transform="translate(544 544) scale(1.18) rotate(-20) translate(-544 -544)">
          <g transform="translate(0 254)">
            <g transform="translate(0 580) scale(.1 -.1)">
              <use xlink:href="#tern-shape" fill="#03110A" stroke="#03110A" stroke-width="900"
                   stroke-linejoin="round"/>
              <use xlink:href="#tern-beak" fill="#03110A" stroke="#03110A" stroke-width="900"
                   stroke-linejoin="round"/>
            </g>
          </g>
        </g>
      </g>
    </g>

    <path id="bird-body-mask"
          d="M644 385c44 7 70 47 67 107-4 76-38 142-106 198 20-79 21-146 7-202-12-49-8-88 32-103z"
          fill="#03110A" stroke="#03110A" stroke-width="42" stroke-linejoin="round"/>

    <g id="wire-tern">
      <g transform="translate(544 544) scale(.82) translate(-544 -544)">
        <g transform="translate(544 544) scale(1.18) rotate(-20) translate(-544 -544)">
          <g transform="translate(0 254)">
            <g transform="translate(0 580) scale(.1 -.1)">
              <use xlink:href="#tern-shape" fill="none" stroke="#73F59B" stroke-width="180"
                   stroke-linejoin="round"/>
              <use xlink:href="#tern-beak" fill="#F99E2A"/>
            </g>
          </g>
        </g>
      </g>
    </g>

    <g id="solid-tern">
      <g transform="translate(544 544) scale(.82) translate(-544 -544)">
        <g transform="translate(544 544) scale(1.18) rotate(-20) translate(-544 -544)">
          <g transform="translate(0 254)">
            <g transform="translate(0 580) scale(.1 -.1)">
              <use xlink:href="#tern-shape" fill="#73F59B"/>
              <use xlink:href="#tern-beak" fill="#F99E2A"/>
            </g>
          </g>
        </g>
      </g>
    </g>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <g id="rows-sparse" fill="#73F59B">
      <rect x="118" y="112" width="724" height="24" rx="5" opacity=".14"/>
      <rect x="118" y="232" width="844" height="24" rx="5" opacity=".12"/>
      <rect x="118" y="352" width="612" height="24" rx="5" opacity=".18"/>
      <rect x="118" y="472" width="790" height="24" rx="5" opacity=".14"/>
      <rect x="118" y="592" width="674" height="24" rx="5" opacity=".19"/>
      <rect x="118" y="712" width="864" height="24" rx="5" opacity=".13"/>
      <rect x="118" y="832" width="746" height="24" rx="5" opacity=".17"/>
      <rect x="118" y="952" width="546" height="24" rx="5" opacity=".18"/>
    </g>

    <g id="bird-wire">
      <use xlink:href="#bird-body-mask"/>
      <use xlink:href="#bird-shield"/>
      <g filter="url(#glow)"><use xlink:href="#wire-tern"/></g>
    </g>
    <g id="bird-solid">
      <use xlink:href="#bird-body-mask"/>
      <use xlink:href="#bird-shield"/>
      <g filter="url(#glow)"><use xlink:href="#solid-tern"/></g>
    </g>

    <g id="cursor-standard"><rect x="684" y="946" width="36" height="36" rx="5" fill="#F99E2A"/></g>
    <g id="cursor-small"><rect x="684" y="953" width="22" height="22" rx="4" fill="#F99E2A"/></g>
    <g id="cursor-wide"><rect x="684" y="950" width="74" height="28" rx="5" fill="#F99E2A"/></g>
    <g id="cursor-tall"><rect x="684" y="938" width="18" height="52" rx="4" fill="#F99E2A"/></g>
    <g id="cursor-underscore"><rect x="684" y="966" width="70" height="12" rx="4" fill="#F99E2A"/></g>
    <g id="cursor-round"><circle cx="702" cy="964" r="18" fill="#F99E2A"/></g>

    <symbol id="tile-standard" viewBox="0 0 1088 1088">
      <rect width="1088" height="1088" rx="190" fill="#03110A"/>
      <use xlink:href="#rows-sparse"/><use xlink:href="#cursor-standard"/><use xlink:href="#bird-wire"/>
    </symbol>
    <symbol id="tile-small" viewBox="0 0 1088 1088">
      <rect width="1088" height="1088" rx="190" fill="#03110A"/>
      <use xlink:href="#rows-sparse"/><use xlink:href="#cursor-small"/><use xlink:href="#bird-wire"/>
    </symbol>
    <symbol id="tile-wide" viewBox="0 0 1088 1088">
      <rect width="1088" height="1088" rx="190" fill="#03110A"/>
      <use xlink:href="#rows-sparse"/><use xlink:href="#cursor-wide"/><use xlink:href="#bird-wire"/>
    </symbol>
    <symbol id="tile-tall" viewBox="0 0 1088 1088">
      <rect width="1088" height="1088" rx="190" fill="#03110A"/>
      <use xlink:href="#rows-sparse"/><use xlink:href="#cursor-tall"/><use xlink:href="#bird-wire"/>
    </symbol>
    <symbol id="tile-underscore" viewBox="0 0 1088 1088">
      <rect width="1088" height="1088" rx="190" fill="#03110A"/>
      <use xlink:href="#rows-sparse"/><use xlink:href="#cursor-underscore"/><use xlink:href="#bird-wire"/>
    </symbol>
    <symbol id="tile-solid" viewBox="0 0 1088 1088">
      <rect width="1088" height="1088" rx="190" fill="#03110A"/>
      <use xlink:href="#rows-sparse"/><use xlink:href="#cursor-round"/><use xlink:href="#bird-solid"/>
    </symbol>
  </defs>

  <rect width="2240" height="1700" fill="#EAE8E1"/>
  <text x="80" y="82" fill="#28292A" font-family="sans-serif" font-size="46" font-weight="700">
    Sparse-output cursor studies
  </text>
  <text x="80" y="124" fill="#5C5D5E" font-family="sans-serif" font-size="24">
    The sparse rows and clearance do not change. The cursor and bird style change.
  </text>

  <g font-family="sans-serif" text-anchor="middle">
    <g transform="translate(80 170)">
      <use xlink:href="#tile-standard" x="24" width="432" height="432"/>
      <text x="240" y="480" fill="#28292A" font-size="30" font-weight="700">Standard square</text>
      <text x="240" y="516" fill="#5C5D5E" font-size="22">Medium square cursor</text>
      <use xlink:href="#tile-standard" x="120" y="560" width="64" height="64"/>
      <use xlink:href="#tile-standard" x="226" y="576" width="32" height="32"/>
      <use xlink:href="#tile-standard" x="304" y="584" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18"><text x="152" y="654">64</text><text x="242" y="654">32</text><text x="312" y="654">16</text></g>
    </g>
    <g transform="translate(790 170)">
      <use xlink:href="#tile-small" x="24" width="432" height="432"/>
      <text x="240" y="480" fill="#28292A" font-size="30" font-weight="700">Small square</text>
      <text x="240" y="516" fill="#5C5D5E" font-size="22">Small square cursor</text>
      <use xlink:href="#tile-small" x="120" y="560" width="64" height="64"/>
      <use xlink:href="#tile-small" x="226" y="576" width="32" height="32"/>
      <use xlink:href="#tile-small" x="304" y="584" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18"><text x="152" y="654">64</text><text x="242" y="654">32</text><text x="312" y="654">16</text></g>
    </g>
    <g transform="translate(1500 170)">
      <use xlink:href="#tile-wide" x="24" width="432" height="432"/>
      <text x="240" y="480" fill="#28292A" font-size="30" font-weight="700">Wide block</text>
      <text x="240" y="516" fill="#5C5D5E" font-size="22">Wide rectangular cursor</text>
      <use xlink:href="#tile-wide" x="120" y="560" width="64" height="64"/>
      <use xlink:href="#tile-wide" x="226" y="576" width="32" height="32"/>
      <use xlink:href="#tile-wide" x="304" y="584" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18"><text x="152" y="654">64</text><text x="242" y="654">32</text><text x="312" y="654">16</text></g>
    </g>

    <g transform="translate(80 910)">
      <use xlink:href="#tile-tall" x="24" width="432" height="432"/>
      <text x="240" y="480" fill="#28292A" font-size="30" font-weight="700">Tall caret</text>
      <text x="240" y="516" fill="#5C5D5E" font-size="22">Tall rectangular cursor</text>
      <use xlink:href="#tile-tall" x="120" y="560" width="64" height="64"/>
      <use xlink:href="#tile-tall" x="226" y="576" width="32" height="32"/>
      <use xlink:href="#tile-tall" x="304" y="584" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18"><text x="152" y="654">64</text><text x="242" y="654">32</text><text x="312" y="654">16</text></g>
    </g>
    <g transform="translate(790 910)">
      <use xlink:href="#tile-underscore" x="24" width="432" height="432"/>
      <text x="240" y="480" fill="#28292A" font-size="30" font-weight="700">Underscore</text>
      <text x="240" y="516" fill="#5C5D5E" font-size="22">Low horizontal cursor</text>
      <use xlink:href="#tile-underscore" x="120" y="560" width="64" height="64"/>
      <use xlink:href="#tile-underscore" x="226" y="576" width="32" height="32"/>
      <use xlink:href="#tile-underscore" x="304" y="584" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18"><text x="152" y="654">64</text><text x="242" y="654">32</text><text x="312" y="654">16</text></g>
    </g>
    <g transform="translate(1500 910)">
      <use xlink:href="#tile-solid" x="24" width="432" height="432"/>
      <text x="240" y="480" fill="#28292A" font-size="30" font-weight="700">Solid bird</text>
      <text x="240" y="516" fill="#5C5D5E" font-size="22">Round cursor and filled bird</text>
      <use xlink:href="#tile-solid" x="120" y="560" width="64" height="64"/>
      <use xlink:href="#tile-solid" x="226" y="576" width="32" height="32"/>
      <use xlink:href="#tile-solid" x="304" y="584" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18"><text x="152" y="654">64</text><text x="242" y="654">32</text><text x="312" y="654">16</text></g>
    </g>
  </g>
</svg>
