<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 2500 2500" width="2500" height="2500" role="img"
     aria-labelledby="title description">
  <title id="title">Sterna phosphor brand concepts</title>
  <desc id="description">Nine phosphor concepts that range from a color change to a new brand mark.</desc>

  <defs>
    <g id="tern-shape">
      <path d="M10585 5604c-16-2-79-9-140-15-289-28-711-120-1005-218-780-260-1415-685-1825-1221l-65-85 153-5c135-5 238-22 237-39-1-3-39-31-87-61-365-233-454-369-584-884-85-340-172-567-298-778-256-430-674-774-1161-957-58-21-106-38-108-36-2 2 23 56 56 121 229 458 388 947 443 1361 7 51 11 95 8 97-19 20-597 49-799 41-1871-75-3631-763-5072-1983-82-69-146-127-145-129 2-2 124 56 272 127 772 377 1360 610 1975 784 1328 376 2542 378 3090 6 32-22 62-45 65-50 13-21-182-305-379-550-192-240-301-359-731-800l-140-144 80 44c141 76 639 372 955 567 46 28 86 50 88 48 4-4-144-295-239-470l-43-80 39 29c248 184 930 784 1269 1116 452 443 637 688 1106 1470 438 731 706 1088 1106 1480 519 508 1088 859 1891 1170 128 49 128 49 73 48-30-1-68-3-85-4z"/>
      <path d="M6880 4124c-305-80-544-406-649-885l-18-86 191 192c357 359 630 515 902 515h53l-6 68c-7 82-33 114-128 161-104 52-233 65-345 35z"/>
    </g>

    <path id="tern-beak"
          d="M7520 3993c-19-2-53-5-75-8l-40-5v-115c0-63 2-115 4-115 3 0 12 6 20 14 9 7 97 59 196 116 99 56 184 106 190 111 8 8-213 10-295 2z"/>

    <g id="tern-composition-shape">
      <g transform="translate(544 544) scale(.82) translate(-544 -544)">
        <g transform="translate(544 544) scale(1.18) rotate(-20) translate(-544 -544)">
          <g transform="translate(0 254)">
            <g transform="translate(0 580) scale(.1 -.1)">
              <use xlink:href="#tern-shape" fill="currentColor"/>
            </g>
          </g>
        </g>
      </g>
    </g>

    <g id="tern-composition-beak">
      <g transform="translate(544 544) scale(.82) translate(-544 -544)">
        <g transform="translate(544 544) scale(1.18) rotate(-20) translate(-544 -544)">
          <g transform="translate(0 254)">
            <g transform="translate(0 580) scale(.1 -.1)">
              <use xlink:href="#tern-beak" fill="currentColor"/>
            </g>
          </g>
        </g>
      </g>
    </g>

    <g id="tern-composition-outline">
      <g transform="translate(544 544) scale(.82) translate(-544 -544)">
        <g transform="translate(544 544) scale(1.18) rotate(-20) translate(-544 -544)">
          <g transform="translate(0 254)">
            <g transform="translate(0 580) scale(.1 -.1)">
              <use xlink:href="#tern-shape" fill="none" stroke="currentColor" stroke-width="180"
                   stroke-linejoin="round"/>
            </g>
          </g>
        </g>
      </g>
    </g>

    <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect y="6" width="8" height="2" fill="#000000" opacity=".3"/>
    </pattern>

    <pattern id="terminal-grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0v64" fill="none" stroke="#73F59B" stroke-width="3" opacity=".11"/>
    </pattern>

    <filter id="green-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="small-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <symbol id="green-mono" viewBox="0 0 1088 1088">
      <rect width="1088" height="1088" rx="190" fill="#03110A"/>
      <use xlink:href="#tern-composition-shape" color="#73F59B"/>
      <use xlink:href="#tern-composition-beak" color="#73F59B"/>
    </symbol>

    <symbol id="amber-mono" viewBox="0 0 1088 1088">
      <rect width="1088" height="1088" rx="190" fill="#160D03"/>
      <use xlink:href="#tern-composition-shape" color="#FFB347"/>
      <use xlink:href="#tern-composition-beak" color="#FFB347"/>
    </symbol>

    <symbol id="negative-screen" viewBox="0 0 1088 1088">
      <rect width="1088" height="1088" rx="190" fill="#73F59B"/>
      <use xlink:href="#tern-composition-shape" color="#062516"/>
      <use xlink:href="#tern-composition-beak" color="#062516"/>
    </symbol>

    <symbol id="crt-bloom" viewBox="0 0 1088 1088">
      <rect width="1088" height="1088" rx="190" fill="#020C07"/>
      <g filter="url(#green-glow)">
        <use xlink:href="#tern-composition-shape" color="#8AFFAE"/>
        <use xlink:href="#tern-composition-beak" color="#8AFFAE"/>
      </g>
      <rect width="1088" height="1088" rx="190" fill="url(#scanlines)" opacity=".42"/>
    </symbol>

    <symbol id="raster-bird" viewBox="0 0 1088 1088">
      <rect width="1088" height="1088" rx="190" fill="#03110A"/>
      <use xlink:href="#tern-composition-shape" color="#73F59B"/>
      <path d="M0 250h1088M0 300h1088M0 350h1088M0 400h1088M0 450h1088
               M0 500h1088M0 550h1088M0 600h1088M0 650h1088M0 700h1088
               M0 750h1088M0 800h1088M0 850h1088"
            stroke="#03110A" stroke-width="14" opacity=".58"/>
      <use xlink:href="#tern-composition-beak" color="#F99E2A"/>
    </symbol>

    <symbol id="wire-bird" viewBox="0 0 1088 1088">
      <rect width="1088" height="1088" rx="190" fill="#03110A"/>
      <g filter="url(#small-glow)">
        <use xlink:href="#tern-composition-outline" color="#73F59B"/>
        <use xlink:href="#tern-composition-beak" color="#F99E2A"/>
      </g>
    </symbol>

    <symbol id="pixel-tern" viewBox="0 0 1088 1088">
      <image xlink:href="phosphor-pixel-tern.png" width="1088" height="1088"
             preserveAspectRatio="none" image-rendering="optimizeSpeed"
             style="image-rendering:pixelated"/>
    </symbol>

    <symbol id="flight-trace" viewBox="0 0 1088 1088">
      <rect width="1088" height="1088" rx="190" fill="#03110A"/>
      <rect width="1088" height="1088" rx="190" fill="url(#terminal-grid)"/>
      <path d="M150 820C300 640 450 600 550 700S690 750 750 530 850 290 930 205"
            fill="none" stroke="#73F59B" stroke-width="46" stroke-linecap="square"
            filter="url(#small-glow)"/>
      <rect x="910" y="174" width="68" height="68" rx="7" fill="#F99E2A"/>
    </symbol>

    <symbol id="s-cursor" viewBox="0 0 1088 1088">
      <rect width="1088" height="1088" rx="190" fill="#03110A"/>
      <rect width="1088" height="1088" rx="190" fill="url(#terminal-grid)"/>
      <text x="210" y="825" fill="#73F59B" font-family="DejaVu Sans Mono, monospace"
            font-size="760" font-weight="700" filter="url(#small-glow)">S</text>
      <rect x="740" y="786" width="150" height="48" rx="6" fill="#F99E2A"/>
    </symbol>
  </defs>

  <rect width="2500" height="2500" fill="#EAE8E1"/>
  <text x="100" y="82" fill="#28292A" font-family="sans-serif" font-size="46" font-weight="700">
    Sterna phosphor brand exploration
  </text>
  <text x="100" y="124" fill="#5C5D5E" font-family="sans-serif" font-size="24">
    The last three concepts can replace the current mark.
  </text>

  <g font-family="sans-serif" text-anchor="middle">
    <g transform="translate(100 160)">
      <use xlink:href="#green-mono" x="60" width="480" height="480"/>
      <text x="300" y="535" fill="#28292A" font-size="30" font-weight="700">Green mono</text>
      <text x="300" y="572" fill="#5C5D5E" font-size="22">A direct phosphor conversion</text>
      <use xlink:href="#green-mono" x="168" y="610" width="64" height="64"/>
      <use xlink:href="#green-mono" x="284" y="626" width="32" height="32"/>
      <use xlink:href="#green-mono" x="376" y="634" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18"><text x="200" y="704">64</text><text x="300" y="704">32</text><text x="384" y="704">16</text></g>
    </g>
    <g transform="translate(950 160)">
      <use xlink:href="#amber-mono" x="60" width="480" height="480"/>
      <text x="300" y="535" fill="#28292A" font-size="30" font-weight="700">Amber mono</text>
      <text x="300" y="572" fill="#5C5D5E" font-size="22">The beak color becomes the brand</text>
      <use xlink:href="#amber-mono" x="168" y="610" width="64" height="64"/>
      <use xlink:href="#amber-mono" x="284" y="626" width="32" height="32"/>
      <use xlink:href="#amber-mono" x="376" y="634" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18"><text x="200" y="704">64</text><text x="300" y="704">32</text><text x="384" y="704">16</text></g>
    </g>
    <g transform="translate(1800 160)">
      <use xlink:href="#negative-screen" x="60" width="480" height="480"/>
      <text x="300" y="535" fill="#28292A" font-size="30" font-weight="700">Negative screen</text>
      <text x="300" y="572" fill="#5C5D5E" font-size="22">The complete tile emits light</text>
      <use xlink:href="#negative-screen" x="168" y="610" width="64" height="64"/>
      <use xlink:href="#negative-screen" x="284" y="626" width="32" height="32"/>
      <use xlink:href="#negative-screen" x="376" y="634" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18"><text x="200" y="704">64</text><text x="300" y="704">32</text><text x="384" y="704">16</text></g>
    </g>

    <g transform="translate(100 940)">
      <use xlink:href="#crt-bloom" x="60" width="480" height="480"/>
      <text x="300" y="535" fill="#28292A" font-size="30" font-weight="700">CRT bloom</text>
      <text x="300" y="572" fill="#5C5D5E" font-size="22">Glow and scanlines become the style</text>
      <use xlink:href="#crt-bloom" x="168" y="610" width="64" height="64"/>
      <use xlink:href="#crt-bloom" x="284" y="626" width="32" height="32"/>
      <use xlink:href="#crt-bloom" x="376" y="634" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18"><text x="200" y="704">64</text><text x="300" y="704">32</text><text x="384" y="704">16</text></g>
    </g>
    <g transform="translate(950 940)">
      <use xlink:href="#raster-bird" x="60" width="480" height="480"/>
      <text x="300" y="535" fill="#28292A" font-size="30" font-weight="700">Raster bird</text>
      <text x="300" y="572" fill="#5C5D5E" font-size="22">Display rows cut through the bird</text>
      <use xlink:href="#raster-bird" x="168" y="610" width="64" height="64"/>
      <use xlink:href="#raster-bird" x="284" y="626" width="32" height="32"/>
      <use xlink:href="#raster-bird" x="376" y="634" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18"><text x="200" y="704">64</text><text x="300" y="704">32</text><text x="384" y="704">16</text></g>
    </g>
    <g transform="translate(1800 940)">
      <use xlink:href="#wire-bird" x="60" width="480" height="480"/>
      <text x="300" y="535" fill="#28292A" font-size="30" font-weight="700">Wire bird</text>
      <text x="300" y="572" fill="#5C5D5E" font-size="22">The silhouette becomes a light trace</text>
      <use xlink:href="#wire-bird" x="168" y="610" width="64" height="64"/>
      <use xlink:href="#wire-bird" x="284" y="626" width="32" height="32"/>
      <use xlink:href="#wire-bird" x="376" y="634" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18"><text x="200" y="704">64</text><text x="300" y="704">32</text><text x="384" y="704">16</text></g>
    </g>

    <g transform="translate(100 1720)">
      <use xlink:href="#pixel-tern" x="60" width="480" height="480"/>
      <text x="300" y="535" fill="#28292A" font-size="30" font-weight="700">Pixel tern</text>
      <text x="300" y="572" fill="#5C5D5E" font-size="22">A new mark uses terminal cells</text>
      <use xlink:href="#pixel-tern" x="168" y="610" width="64" height="64"/>
      <use xlink:href="#pixel-tern" x="284" y="626" width="32" height="32"/>
      <use xlink:href="#pixel-tern" x="376" y="634" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18"><text x="200" y="704">64</text><text x="300" y="704">32</text><text x="384" y="704">16</text></g>
    </g>
    <g transform="translate(950 1720)">
      <use xlink:href="#flight-trace" x="60" width="480" height="480"/>
      <text x="300" y="535" fill="#28292A" font-size="30" font-weight="700">Flight trace</text>
      <text x="300" y="572" fill="#5C5D5E" font-size="22">The S-shaped path replaces the bird</text>
      <use xlink:href="#flight-trace" x="168" y="610" width="64" height="64"/>
      <use xlink:href="#flight-trace" x="284" y="626" width="32" height="32"/>
      <use xlink:href="#flight-trace" x="376" y="634" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18"><text x="200" y="704">64</text><text x="300" y="704">32</text><text x="384" y="704">16</text></g>
    </g>
    <g transform="translate(1800 1720)">
      <use xlink:href="#s-cursor" x="60" width="480" height="480"/>
      <text x="300" y="535" fill="#28292A" font-size="30" font-weight="700">S cursor</text>
      <text x="300" y="572" fill="#5C5D5E" font-size="22">A terminal monogram replaces the bird</text>
      <use xlink:href="#s-cursor" x="168" y="610" width="64" height="64"/>
      <use xlink:href="#s-cursor" x="284" y="626" width="32" height="32"/>
      <use xlink:href="#s-cursor" x="376" y="634" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18"><text x="200" y="704">64</text><text x="300" y="704">32</text><text x="384" y="704">16</text></g>
    </g>
  </g>
</svg>
