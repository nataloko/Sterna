      <text x="240" y="480" fill="#28292A" font-size="30" font-weight="700">150%</text>
      <text x="240" y="516" fill="#5C5D5E" font-size="22">Strong prompt</text>
      <use xlink:href="#prompt-150" x="120" y="560" width="64" height="64"/>
      <use xlink:href="#prompt-150" x="226" y="576" width="32" height="32"/>
      <use xlink:href="#prompt-150" x="304" y="584" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18"><text x="152" y="654">64</text><text x="242" y="654">32</text><text x="312" y="654">16</text></g>
    </g>
    <g transform="translate(1500 910)">
