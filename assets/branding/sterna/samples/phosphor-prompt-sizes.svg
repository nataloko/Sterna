      <use xlink:href="#prompt-75" x="226" y="576" width="32" height="32"/>
      <use xlink:href="#prompt-75" x="304" y="584" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18"><text x="152" y="654">64</text><text x="242" y="654">32</text><text x="312" y="654">16</text></g>
