              <path d="M7520 3993c-19-2-53-5-75-8l-40-5v-115c0-63 2-115 4-115 3 0 12 6 20 14 9 7 97 59 196 116 99 56 184 106 190 111 8 8-213 10-295 2z"/>
            </g>
          </g>
        </g>
      </g>
    </symbol>

    <g id="prompt-mark">
      <path d="m752 792 42 24-42 24" fill="none" stroke="#73F59B" stroke-width="18"
            stroke-linecap="square" stroke-linejoin="miter"/>
      <rect x="818" y="830" width="54" height="22" rx="3" fill="#F99E2A"/>
    </g>

    <symbol id="prompt-50" viewBox="0 0 1088 1088">
