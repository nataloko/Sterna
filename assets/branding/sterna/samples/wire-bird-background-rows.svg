<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 2240 1700" width="2240" height="1700" role="img"
     aria-labelledby="title description">
  <title id="title">Sterna wire bird with background terminal rows</title>
  <desc id="description">Six phosphor row patterns behind the Sterna wire bird.</desc>

  <defs>
