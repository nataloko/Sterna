  <rect width="2240" height="1700" fill="#EAE8E1"/>
  <text x="80" y="82" fill="#28292A" font-family="sans-serif" font-size="46" font-weight="700">
    Phosphor terminal rows behind the wire bird
  </text>
  <text x="80" y="124" fill="#5C5D5E" font-family="sans-serif" font-size="24">
    The bird stays bright above each background pattern.
  </text>

  <g font-family="sans-serif" text-anchor="middle">
    <g transform="translate(80 170)">
      <use xlink:href="#tile-full" x="24" width="432" height="432"/>
      <text x="240" y="480" fill="#28292A" font-size="30" font-weight="700">Full field</text>
      <text x="240" y="516" fill="#5C5D5E" font-size="22">Rows fill the complete tile</text>
      <use xlink:href="#tile-full" x="120" y="560" width="64" height="64"/>
      <use xlink:href="#tile-full" x="226" y="576" width="32" height="32"/>
      <use xlink:href="#tile-full" x="304" y="584" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18"><text x="152" y="654">64</text><text x="242" y="654">32</text><text x="312" y="654">16</text></g>
    </g>
    <g transform="translate(790 170)">
      <use xlink:href="#tile-left" x="24" width="432" height="432"/>
      <text x="240" y="480" fill="#28292A" font-size="30" font-weight="700">Left block</text>
      <text x="240" y="516" fill="#5C5D5E" font-size="22">Rows sit behind the lower wing</text>
      <use xlink:href="#tile-left" x="120" y="560" width="64" height="64"/>
      <use xlink:href="#tile-left" x="226" y="576" width="32" height="32"/>
      <use xlink:href="#tile-left" x="304" y="584" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18"><text x="152" y="654">64</text><text x="242" y="654">32</text><text x="312" y="654">16</text></g>
    </g>
    <g transform="translate(1500 170)">
      <use xlink:href="#tile-right" x="24" width="432" height="432"/>
      <text x="240" y="480" fill="#28292A" font-size="30" font-weight="700">Right block</text>
      <text x="240" y="516" fill="#5C5D5E" font-size="22">Rows fill the right side</text>
      <use xlink:href="#tile-right" x="120" y="560" width="64" height="64"/>
      <use xlink:href="#tile-right" x="226" y="576" width="32" height="32"/>
      <use xlink:href="#tile-right" x="304" y="584" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18"><text x="152" y="654">64</text><text x="242" y="654">32</text><text x="312" y="654">16</text></g>
    </g>

    <g transform="translate(80 910)">
      <use xlink:href="#tile-band" x="24" width="432" height="432"/>
      <text x="240" y="480" fill="#28292A" font-size="30" font-weight="700">Center band</text>
      <text x="240" y="516" fill="#5C5D5E" font-size="22">Wide rows cross the center</text>
      <use xlink:href="#tile-band" x="120" y="560" width="64" height="64"/>
      <use xlink:href="#tile-band" x="226" y="576" width="32" height="32"/>
      <use xlink:href="#tile-band" x="304" y="584" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18"><text x="152" y="654">64</text><text x="242" y="654">32</text><text x="312" y="654">16</text></g>
    </g>
    <g transform="translate(790 910)">
      <use xlink:href="#tile-dense" x="24" width="432" height="432"/>
      <text x="240" y="480" fill="#28292A" font-size="30" font-weight="700">Dense screen</text>
      <text x="240" y="516" fill="#5C5D5E" font-size="22">Thin rows form a screen texture</text>
      <use xlink:href="#tile-dense" x="120" y="560" width="64" height="64"/>
      <use xlink:href="#tile-dense" x="226" y="576" width="32" height="32"/>
      <use xlink:href="#tile-dense" x="304" y="584" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18"><text x="152" y="654">64</text><text x="242" y="654">32</text><text x="312" y="654">16</text></g>
    </g>
    <g transform="translate(1500 910)">
      <use xlink:href="#tile-split" x="24" width="432" height="432"/>
      <text x="240" y="480" fill="#28292A" font-size="30" font-weight="700">Split screen</text>
      <text x="240" y="516" fill="#5C5D5E" font-size="22">Two output columns fill the tile</text>
