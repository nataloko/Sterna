    <g id="bird-shield">
      <g transform="translate(544 544) scale(.82) translate(-544 -544)">
        <g transform="translate(544 544) scale(1.18) rotate(-20) translate(-544 -544)">
          <g transform="translate(0 254)">
            <g transform="translate(0 580) scale(.1 -.1)">
              <use xlink:href="#tern-shape" fill="#03110A" opacity=".86"/>
            </g>
          </g>
        </g>
      </g>
    </g>

    <g id="bird-shield-clear">
      <g transform="translate(544 544) scale(.82) translate(-544 -544)">
        <g transform="translate(544 544) scale(1.18) rotate(-20) translate(-544 -544)">
          <g transform="translate(0 254)">
            <g transform="translate(0 580) scale(.1 -.1)">
              <use xlink:href="#tern-shape" fill="#03110A" stroke="#03110A" stroke-width="300"
                   stroke-linejoin="round"/>
              <use xlink:href="#tern-beak" fill="#03110A" stroke="#03110A" stroke-width="300"
                   stroke-linejoin="round"/>
            </g>
          </g>
        </g>
      </g>
    </g>

    <path id="bird-body-mask"
          d="M644 385c44 7 70 47 67 107-4 76-38 142-106 198 20-79 21-146 7-202-12-49-8-88 32-103z"
          fill="#03110A" stroke="#03110A" stroke-width="42" stroke-linejoin="round"/>

    <g id="wire-tern">
      <g transform="translate(544 544) scale(.82) translate(-544 -544)">
        <g transform="translate(544 544) scale(1.18) rotate(-20) translate(-544 -544)">
          <g transform="translate(0 254)">
            <g transform="translate(0 580) scale(.1 -.1)">
              <use xlink:href="#tern-shape" fill="none" stroke="#73F59B" stroke-width="180"
                   stroke-linejoin="round"/>
              <use xlink:href="#tern-beak" fill="#F99E2A"/>
            </g>
          </g>
        </g>
      </g>
    </g>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

