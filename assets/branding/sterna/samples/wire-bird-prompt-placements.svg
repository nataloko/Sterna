<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 2240 1700" width="2240" height="1700" role="img"
     aria-labelledby="title description">
  <title id="title">Sterna wire bird prompt placements</title>
  <desc id="description">Six placements for a 200 percent prompt beside the phosphor wire bird.</desc>

  <defs>
    <g id="tern-shape">
      <path d="M10585 5604c-16-2-79-9-140-15-289-28-711-120-1005-218-780-260-1415-685-1825-1221l-65-85 153-5c135-5 238-22 237-39-1-3-39-31-87-61-365-233-454-369-584-884-85-340-172-567-298-778-256-430-674-774-1161-957-58-21-106-38-108-36-2 2 23 56 56 121 229 458 388 947 443 1361 7 51 11 95 8 97-19 20-597 49-799 41-1871-75-3631-763-5072-1983-82-69-146-127-145-129 2-2 124 56 272 127 772 377 1360 610 1975 784 1328 376 2542 378 3090 6 32-22 62-45 65-50 13-21-182-305-379-550-192-240-301-359-731-800l-140-144 80 44c141 76 639 372 955 567 46 28 86 50 88 48 4-4-144-295-239-470l-43-80 39 29c248 184 930 784 1269 1116 452 443 637 688 1106 1470 438 731 706 1088 1106 1480 519 508 1088 859 1891 1170 128 49 128 49 73 48-30-1-68-3-85-4z"/>
      <path d="M6880 4124c-305-80-544-406-649-885l-18-86 191 192c357 359 630 515 902 515h53l-6 68c-7 82-33 114-128 161-104 52-233 65-345 35z"/>
    </g>

    <path id="tern-beak"
          d="M7520 3993c-19-2-53-5-75-8l-40-5v-115c0-63 2-115 4-115 3 0 12 6 20 14 9 7 97 59 196 116 99 56 184 106 190 111 8 8-213 10-295 2z"/>

    <g id="wire-tern">
      <g transform="translate(544 544) scale(.82) translate(-544 -544)">
        <g transform="translate(544 544) scale(1.18) rotate(-20) translate(-544 -544)">
          <g transform="translate(0 254)">
            <g transform="translate(0 580) scale(.1 -.1)">
              <use xlink:href="#tern-shape" fill="none" stroke="#73F59B" stroke-width="180"
                   stroke-linejoin="round"/>
              <use xlink:href="#tern-beak" fill="#F99E2A"/>
            </g>
          </g>
        </g>
      </g>
    </g>

    <g id="prompt-mark">
      <path d="m752 792 42 24-42 24" fill="none" stroke="#73F59B" stroke-width="18"
            stroke-linecap="square" stroke-linejoin="miter"/>
      <rect x="818" y="830" width="54" height="22" rx="3" fill="#F99E2A"/>
    </g>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <symbol id="place-near" viewBox="0 0 1088 1088">
      <rect width="1088" height="1088" rx="190" fill="#03110A"/>
      <g filter="url(#glow)"><use xlink:href="#wire-tern"/></g>
      <use xlink:href="#prompt-mark"
           transform="translate(80 0) translate(890 870) scale(2) translate(-890 -870)"/>
    </symbol>
    <symbol id="place-balanced" viewBox="0 0 1088 1088">
      <rect width="1088" height="1088" rx="190" fill="#03110A"/>
      <g filter="url(#glow)"><use xlink:href="#wire-tern"/></g>
      <use xlink:href="#prompt-mark"
           transform="translate(110 0) translate(890 870) scale(2) translate(-890 -870)"/>
    </symbol>
    <symbol id="place-far" viewBox="0 0 1088 1088">
      <rect width="1088" height="1088" rx="190" fill="#03110A"/>
      <g filter="url(#glow)"><use xlink:href="#wire-tern"/></g>
      <use xlink:href="#prompt-mark"
           transform="translate(140 0) translate(890 870) scale(2) translate(-890 -870)"/>
    </symbol>
    <symbol id="place-high" viewBox="0 0 1088 1088">
      <rect width="1088" height="1088" rx="190" fill="#03110A"/>
      <g filter="url(#glow)"><use xlink:href="#wire-tern"/></g>
      <use xlink:href="#prompt-mark"
           transform="translate(110 -40) translate(890 870) scale(2) translate(-890 -870)"/>
    </symbol>
    <symbol id="place-low" viewBox="0 0 1088 1088">
      <rect width="1088" height="1088" rx="190" fill="#03110A"/>
      <g filter="url(#glow)"><use xlink:href="#wire-tern"/></g>
      <use xlink:href="#prompt-mark"
           transform="translate(110 40) translate(890 870) scale(2) translate(-890 -870)"/>
    </symbol>
    <symbol id="place-corner" viewBox="0 0 1088 1088">
      <rect width="1088" height="1088" rx="190" fill="#03110A"/>
      <g filter="url(#glow)"><use xlink:href="#wire-tern"/></g>
      <use xlink:href="#prompt-mark"
           transform="translate(150 30) translate(890 870) scale(2) translate(-890 -870)"/>
    </symbol>
  </defs>

  <rect width="2240" height="1700" fill="#EAE8E1"/>
  <text x="80" y="82" fill="#28292A" font-family="sans-serif" font-size="46" font-weight="700">
    Wire bird with 200% prompt
  </text>
  <text x="80" y="124" fill="#5C5D5E" font-family="sans-serif" font-size="24">
    The prompt moves right and stays clear of the bird.
  </text>

  <g font-family="sans-serif" text-anchor="middle">
    <g transform="translate(80 170)">
      <use xlink:href="#place-near" x="24" width="432" height="432"/>
      <text x="240" y="480" fill="#28292A" font-size="30" font-weight="700">Near right</text>
      <text x="240" y="516" fill="#5C5D5E" font-size="22">Right 80</text>
      <use xlink:href="#place-near" x="120" y="560" width="64" height="64"/>
      <use xlink:href="#place-near" x="226" y="576" width="32" height="32"/>
      <use xlink:href="#place-near" x="304" y="584" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18"><text x="152" y="654">64</text><text x="242" y="654">32</text><text x="312" y="654">16</text></g>
    </g>
    <g transform="translate(790 170)">
      <use xlink:href="#place-balanced" x="24" width="432" height="432"/>
      <text x="240" y="480" fill="#28292A" font-size="30" font-weight="700">Balanced right</text>
      <text x="240" y="516" fill="#5C5D5E" font-size="22">Right 110</text>
      <use xlink:href="#place-balanced" x="120" y="560" width="64" height="64"/>
      <use xlink:href="#place-balanced" x="226" y="576" width="32" height="32"/>
      <use xlink:href="#place-balanced" x="304" y="584" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18"><text x="152" y="654">64</text><text x="242" y="654">32</text><text x="312" y="654">16</text></g>
    </g>
    <g transform="translate(1500 170)">
      <use xlink:href="#place-far" x="24" width="432" height="432"/>
      <text x="240" y="480" fill="#28292A" font-size="30" font-weight="700">Far right</text>
      <text x="240" y="516" fill="#5C5D5E" font-size="22">Right 140</text>
      <use xlink:href="#place-far" x="120" y="560" width="64" height="64"/>
      <use xlink:href="#place-far" x="226" y="576" width="32" height="32"/>
      <use xlink:href="#place-far" x="304" y="584" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18"><text x="152" y="654">64</text><text x="242" y="654">32</text><text x="312" y="654">16</text></g>
    </g>

    <g transform="translate(80 910)">
      <use xlink:href="#place-high" x="24" width="432" height="432"/>
      <text x="240" y="480" fill="#28292A" font-size="30" font-weight="700">High right</text>
      <text x="240" y="516" fill="#5C5D5E" font-size="22">Right 110, up 40</text>
      <use xlink:href="#place-high" x="120" y="560" width="64" height="64"/>
      <use xlink:href="#place-high" x="226" y="576" width="32" height="32"/>
      <use xlink:href="#place-high" x="304" y="584" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18"><text x="152" y="654">64</text><text x="242" y="654">32</text><text x="312" y="654">16</text></g>
    </g>
    <g transform="translate(790 910)">
      <use xlink:href="#place-low" x="24" width="432" height="432"/>
      <text x="240" y="480" fill="#28292A" font-size="30" font-weight="700">Low right</text>
      <text x="240" y="516" fill="#5C5D5E" font-size="22">Right 110, down 40</text>
      <use xlink:href="#place-low" x="120" y="560" width="64" height="64"/>
      <use xlink:href="#place-low" x="226" y="576" width="32" height="32"/>
      <use xlink:href="#place-low" x="304" y="584" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18"><text x="152" y="654">64</text><text x="242" y="654">32</text><text x="312" y="654">16</text></g>
    </g>
    <g transform="translate(1500 910)">
      <use xlink:href="#place-corner" x="24" width="432" height="432"/>
      <text x="240" y="480" fill="#28292A" font-size="30" font-weight="700">Corner lock</text>
      <text x="240" y="516" fill="#5C5D5E" font-size="22">Right 150, down 30</text>
      <use xlink:href="#place-corner" x="120" y="560" width="64" height="64"/>
      <use xlink:href="#place-corner" x="226" y="576" width="32" height="32"/>
      <use xlink:href="#place-corner" x="304" y="584" width="16" height="16"/>
      <g fill="#5C5D5E" font-size="18"><text x="152" y="654">64</text><text x="242" y="654">32</text><text x="312" y="654">16</text></g>
    </g>
  </g>
</svg>
