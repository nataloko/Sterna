[package]
name = "tt-macro"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A running TTL macro, joined to a running session"

# The join, and the reason it is a crate of its own rather than a module in
# either half. `tt-ttl` is the language and knows nothing about terminals;
# `tt-session` is a terminal and should not make everyone who wants one compile
# Oniguruma. Upstream draws the same line and calls it a process boundary.
[dependencies]
tt-conn.workspace = true
tt-session.workspace = true
tt-ttl.workspace = true
# For the transfer commands alone: a `zmodemsend` names a protocol and its
# options, and there is nothing to be gained by copying that enumeration into
# a third place. `tt-session` compiles it either way.
tt-xfer.workspace = true

[dev-dependencies]
tt-grid.workspace = true
tt-vt.workspace = true
tempfile = "3"

# `tests/lua.rs` only. Nothing in this crate is Lua-aware — the point of that
# suite is that the host written for the macro language carries the other one
# unchanged — so the dependency belongs here and not above.
tt-lua.workspace = true

# One `poll(2)`, to assert that the wakeup descriptor goes quiet and then
# wakes. Asserting it is *returned* would prove nothing.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The macro thread wakes the frontend with a manual-reset event, the native
# counterpart of the Unix socket pair.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
