[package]
name = "tt-conn"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serialport = "4.9.0"

# known_hosts. Versions pinned to what russh already resolves, so the SSH
# transport does not drag a second copy of any of them into the tree.
data-encoding = "2.11"
getrandom = "0.4"
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"

# des: 3des-cbc is feature-gated, and it is what pre-2005 gear offers.
# dsa: ssh-dss host keys, for the same reason. Both are reachable only with
# `SshParams::legacy`; see spike 5's first finding.
russh = { version = "0.62", features = ["des", "dsa"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
