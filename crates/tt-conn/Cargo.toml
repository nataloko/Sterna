[package]
name = "tt-conn"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serialport = "4.9.0"

# known_hosts. Versions pinned to what russh already resolves, so the SSH
# transport does not drag a second copy of any of them into the tree.
data-encoding = "2.11"
getrandom = "0.4"
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"

# des: 3des-cbc is feature-gated, and it is what pre-2005 gear offers.
# dsa: ssh-dss host keys, for the same reason. Both are reachable only with
# `SshParams::legacy`; see spike 5's first finding.
russh = { version = "0.62", features = ["des", "dsa"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }

# The local shell. Adopted for the two things that are actually hard and
# actually platform-specific — the `setsid`/`TIOCSCTTY` dance in the forked
# child, and ConPTY when Stage 3 arrives. It drags in `serial2`, a *second*
# serial-port crate, unconditionally and with no feature to turn it off; see
# `README.md` for why that is accepted rather than fixed.
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Manual-reset events are the native frontend wakeup for worker channels and
# blocking byte readers. They are borrowed through the flat ABI by Qt.
windows-sys = { version = "0.61", features = [
    "Win32_Devices_Communication",
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dev-dependencies]
# The pty tests poll the descriptor and check the child is gone, which is the
# frontend's own event loop in miniature.
libc = "0.2"
