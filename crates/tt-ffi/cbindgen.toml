language = "C"
header = """/* Sterna core — the C ABI. GENERATED BY cbindgen, DO NOT EDIT.
 *
 * Regenerated by `cargo build -p tt-ffi`; CI fails if the committed copy and
 * the source disagree. Edit `crates/tt-ffi/src/lib.rs` instead.
 *
 * Copyright (c) the Sterna authors. 3-clause BSD; see LICENSE.
 */"""
include_guard = "STERNA_H"
style = "type"
pragma_once = false
cpp_compat = true
usize_is_size_t = true
documentation_style = "doxy"
line_length = 78
tab_width = 4
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]

[export]
# `locator_flag` is a private module inside `tt-vt`; cbindgen parses source
# files rather than crates, so it cannot see that. Left in, its constants would
# put `PIXEL`, `ONE_SHOT` and `FILTERED` into every translation unit that
# includes this header.
#
# `LogMode` and `LogOptions` are `tt-session`'s own shapes; the ABI carries
# `TtLogOptions` instead, which is `repr(C)` and spells the mode as a bool.
exclude = [
    "ONE_SHOT", "PIXEL", "BUTTON_DOWN", "BUTTON_UP", "FILTERED",
    "LogMode", "LogOptions", "SessionLog",
]

# Types and constants that reach the ABI from the core crates keep their Rust
# names, which are not namespaced. Rename rather than duplicate the definitions
# here: one list of key names, one list of attribute bits, and a header diff
# whenever either moves.
[export.rename]
"Cell" = "TtCell"
"Key" = "TtKey"
"Modifiers" = "TtModifiers"
"MouseEvent" = "TtMouseEvent"
"Parity" = "TtParity"
"PinControl" = "TtPinControl"
"FlowControl" = "TtFlowControl"
"TermId" = "TtTermId"
"Tracking" = "TtTracking"
# `Timestamp` unprefixed in a public C header is a collision waiting to
# happen — it is a common enough name that some other header will have one.
"Timestamp" = "TtLogTimestamp"

"CELL_TEXT_MAX" = "TT_CELL_TEXT_MAX"
"ATTR_BOLD" = "TT_ATTR_BOLD"
"ATTR_UNDER" = "TT_ATTR_UNDER"
"ATTR_SPECIAL" = "TT_ATTR_SPECIAL"
"ATTR_BLINK" = "TT_ATTR_BLINK"
"ATTR_REVERSE" = "TT_ATTR_REVERSE"
"ATTR_LINE_CONTINUED" = "TT_ATTR_LINE_CONTINUED"
"ATTR_URL" = "TT_ATTR_URL"
"ATTR_SGR_MASK" = "TT_ATTR_SGR_MASK"
"ATTR_MASK" = "TT_ATTR_MASK"
"ATTR2_FORE" = "TT_ATTR2_FORE"
"ATTR2_BACK" = "TT_ATTR2_BACK"
"ATTR2_COLOR_MASK" = "TT_ATTR2_COLOR_MASK"
"ATTR2_PROTECT" = "TT_ATTR2_PROTECT"
"DEFAULT_FG" = "TT_DEFAULT_FG"
"DEFAULT_BG" = "TT_DEFAULT_BG"
"BUFF_X_MAX" = "TT_BUFF_X_MAX"
"WIDTH_NARROW" = "TT_WIDTH_NARROW"
"WIDTH_WIDE" = "TT_WIDTH_WIDE"
"WIDTH_PAD" = "TT_WIDTH_PAD"
"BUTTON_LEFT" = "TT_BUTTON_LEFT"
"BUTTON_MIDDLE" = "TT_BUTTON_MIDDLE"
"BUTTON_RIGHT" = "TT_BUTTON_RIGHT"
"BUTTON_RELEASE" = "TT_BUTTON_RELEASE"

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = false
