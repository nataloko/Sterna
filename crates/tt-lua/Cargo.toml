[package]
name = "tt-lua"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lua, over the same host the macro language uses"

[dependencies]
tt-ttl.workspace = true

# `vendored` compiles Lua 5.4 from source with `cc`, which this tree already
# needs for `winshim/` and the vendored protocols. The alternative is a system
# `liblua` and a `pkg-config` probe, which would make the build depend on
# whether the container happens to have one — and the two containers here do
# not have the same packages.
mlua = { version = "0.12", features = ["lua54", "vendored", "send"] }
