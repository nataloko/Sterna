[package]
name = "tt-session"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tt-conn.workspace = true
tt-grid.workspace = true
tt-vt.workspace = true

# Only the hardware tests, and only to call `poll(2)` — the thing `poll_fd`
# exists to be handed to. Asserting the descriptor is *returned* would prove
# nothing; asserting it goes quiet and then wakes is the whole contract.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
