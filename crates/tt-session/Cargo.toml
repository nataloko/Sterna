[package]
name = "tt-session"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
regex.workspace = true
tt-conn.workspace = true
tt-config.workspace = true
tt-grid.workspace = true
tt-vt.workspace = true
tt-xfer.workspace = true

# Two things, both unix-only: `localtime_r`, for the local offset a log
# timestamp needs and which nothing in std can answer, and `poll(2)` in the
# hardware tests — the call `poll_fd` exists to be handed to. Asserting the
# descriptor is *returned* would prove nothing; asserting it goes quiet and
# then wakes is the whole contract.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The current timezone bias and user name for log timestamps/templates. File
# names themselves still go through the platform C runtime in logname.rs.
windows-sys = { version = "0.61", features = [
    "Win32_System_Environment",
    "Win32_System_SystemServices",
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
tempfile = "3"
