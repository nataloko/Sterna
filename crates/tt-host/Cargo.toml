[package]
name = "tt-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A headless terminal that runs a program on a pty"

[dependencies]
tt-conn.workspace = true
tt-grid.workspace = true
tt-session.workspace = true
tt-vt.workspace = true

# poll(2) on the descriptor the session hands out — the same wait the Qt shell
# does with a QSocketNotifier, minus Qt.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Wait on ConPTY's manual-reset event, the same native object Qt watches with
# QWinEventNotifier in the windowed frontend.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }
