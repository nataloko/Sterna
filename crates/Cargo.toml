[workspace]
resolver = "2"
members = [
    "tt-grid",
    "tt-charset",
    "tt-vt",
    "tt-conn",
    "tt-session",
    "tt-config",
    "tt-i18n",
    "tt-xfer",
    "tt-ttl",
    "tt-lua",
    "tt-macro",
    "tt-ctl",
    "tt-ffi",
    "tt-dump",
    "tt-host",
    "tt-fuzz",
    "tt-bench",
]

# This workspace is `crates/`, not the repository root, on purpose: the Stage 0
# spikes (serial-audit/, ssh-audit/) are standalone crates with their own
# lockfiles and their own CI jobs, and folding them in here would entangle the
# core's dependency resolution with audit tooling that is not shipped.

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/nataloko/Sterna"

[workspace.dependencies]
tt-grid = { path = "tt-grid" }
tt-charset = { path = "tt-charset" }
tt-vt = { path = "tt-vt" }
tt-conn = { path = "tt-conn" }
tt-session = { path = "tt-session" }
tt-config = { path = "tt-config" }
tt-i18n = { path = "tt-i18n" }
tt-xfer = { path = "tt-xfer" }
tt-ttl = { path = "tt-ttl" }
tt-lua = { path = "tt-lua" }
tt-macro = { path = "tt-macro" }
tt-ctl = { path = "tt-ctl" }
tt-ffi = { path = "tt-ffi" }

# The highlight rules' engine, and the reason it is this one rather than the
# Oniguruma `tt-ttl` already carries: matching runs inside `paintEvent`, over
# every visible row, on the UI thread — and the far end chooses the haystack.
# A backtracking engine there is a window that a pattern like `(\w+\s*)+:` can
# freeze; this one is linear in the length of the input by construction, so
# there is no retry limit to pick and no way for a rule to stop the drawing.
# `RegexSet` also tests every rule in one pass instead of one pass each.
#
# `default-features = false` drops the Unicode tables nothing here asks for —
# age, script and segmentation, which are the large ones. What is left covers
# `\d \w \s \b`, `(?i)` and `\p{L}`; `\p{Greek}` fails to compile, and says so.
regex = { version = "1.12", default-features = false, features = [
    "std",
    "perf",
    "unicode-bool",
    "unicode-case",
    "unicode-gencat",
    "unicode-perl",
] }

# `setpassword2` derives its key with 210001 iterations of PBKDF2-HMAC-SHA512,
# which is the point of it — but an unoptimised RustCrypto is roughly thirty
# times slower than an optimised one, and that turns `cargo test -p tt-ttl`
# from three seconds into thirty. Optimising the four crypto crates alone
# leaves every crate we actually debug built exactly as before.
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
