[package]
name = "tt-ttl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tera Term's TTL macro language, as an interpreter with no window in it"

# Until the password family this crate had no dependencies at all, and the
# comment on `ScriptHost::strftime` still explains why that was worth keeping.
# `setpassword2` ended it: its file format is AES-256-CTR under a PBKDF2 key
# with an HMAC over the record, and hand-rolling any of that would be worse
# than depending on it. Every crate here is one `tt-conn` already pulls in
# through `russh`, at the version already in the lock file, so the shipped
# binary gains no new code — only this crate's own test build does.
[dependencies]
# `WritePrivateProfileString`, which is where `setpassword` puts its output.
# The Win32 semantics were audited in `ini-audit/` and implemented once, in
# `tt-config`; a second reader here would be a second set of answers.
tt-config.workspace = true

aes = "0.9"
ctr = "0.10"
getrandom = "0.3"
hmac = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha2 = "0.11"

# Oniguruma, which the regex commands are documented in terms of and which
# nothing else implements: `regexoption` names eleven syntaxes and thirty
# encodings, and the patterns want Ruby's backreferences and look-around. Tera
# Term vendors the same library. `default-features = false` drops the crate's
# `bindgen` step — with it on, building needs `libclang` at hand, and without
# it the pre-generated bindings are used and `cc` is the only requirement.
onig = { version = "6.5", default-features = false }
onig_sys = { version = "69.9", default-features = false }

[target.'cfg(windows)'.dependencies]
# `getspecialfolder` is a shell API rather than an environment convention on
# Windows. The path is returned from COM task memory even though no apartment
# needs to be initialised for this call.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# `OUTPUTDEBUGSTRING_ENABLE`, which is commented out at `ttmparse.h:36`. With
# it off — as it is in every shipping Tera Term — `outputdebugstring` is not a
# reserved word, so a macro using it gets the syntax error an unknown word
# gets, and this port has to agree.
[features]
outputdebugstring = []
