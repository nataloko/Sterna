# GitHub builds the release binaries; the updater signing key stays offline.
# A version tag produces a draft containing the three unsigned build outputs.
# `packaging/release.sh` downloads those exact bytes, signs their metadata
# locally, verifies the complete asset set, and publishes the release.
name: release-build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: version and tag agree
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check release version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' crates/Cargo.toml | head -1)
          cmake_version=$(sed -n 's/^project(sterna-shell VERSION \([^ ]*\).*/\1/p' shell/CMakeLists.txt)
          test -n "$version"
          test "$cmake_version" = "$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi

  linux:
    name: Linux x86-64 AppImage
    needs: preflight
    runs-on: ubuntu-24.04
    # AlmaLinux 8, maintained by the manylinux project. Every shipped ELF is
    # checked against its glibc 2.28 contract by the package build.
    timeout-minutes: 120
    env:
      MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:f854c50adf7b7a325bc4794316f3758d387a41d61f9e2ebca0f26c7dc8f761d4
    steps:
      - uses: actions/checkout@v6
      - name: Make room for the Qt bootstrap
        # Standard runners expose only 14 GiB. Keep the manylinux build in
        # Docker, but reclaim host toolchains this job never uses first.
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache/restore@v5
        id: qt-cache
        with:
          path: packaging/appimage/toolchain/qt-6.11.1
          key: appimage-qt-6.11.1-manylinux-2-28-x86-64-v1
      - name: Start portable build container
        run: |
          docker run --detach --name sterna-manylinux \
            --volume "$GITHUB_WORKSPACE:/repo:rw" \
            --volume "$HOME/.cargo:/root/.cargo:rw" \
            --volume "$HOME/.rustup:/root/.rustup:ro" \
            --workdir /repo \
            --entrypoint /bin/sleep \
            "$MANYLINUX_IMAGE" infinity
      - name: Install portable build dependencies
        run: |
          docker exec sterna-manylinux bash -lc \
            './packaging/appimage/install-build-deps.sh'
      - name: Build portable Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          docker exec sterna-manylinux bash -lc \
            'export CMAKE_BUILD_PARALLEL_LEVEL=1; ./packaging/appimage/build-qt.sh'
      - name: Cache portable Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: packaging/appimage/toolchain/qt-6.11.1
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}
      - name: Build AppImage
        run: |
          docker exec sterna-manylinux bash -lc '
              set -euo pipefail
              export PATH=$PWD/packaging/appimage/toolchain/qt-6.11.1/bin:$PATH
              export CARGO_BUILD_JOBS=4 CMAKE_BUILD_PARALLEL_LEVEL=4
              ./packaging/appimage/build.sh --clean
            '
      - name: Smoke-test packaged application
        env:
          # The extraction fallback avoids depending on FUSE on the runner.
          APPIMAGE_EXTRACT_AND_RUN: 1
          QT_QPA_PLATFORM: offscreen
        run: |
          ./packaging/appimage/build/sterna-x86_64.AppImage --version
          readelf --string-dump=.upd_info \
            ./packaging/appimage/build/sterna-x86_64.AppImage |
            grep -F 'gh-releases-zsync|nataloko|Sterna|latest|sterna-x86_64.AppImage.zsync'
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-x86-64
          path: |
            packaging/appimage/build/sterna-x86_64.AppImage
            packaging/appimage/build/sterna-x86_64.AppImage.zsync
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Stop portable build container
        if: always()
        run: docker rm --force sterna-manylinux 2>/dev/null || true

  windows:
    name: Windows x86-64 installer
    needs: preflight
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    steps:
      - name: Install Fedora cross-build dependencies
        run: |
          dnf install -y \
            cmake gcc-c++ git gzip nasm ninja-build perl tar \
            mingw32-nsis mingw64-binutils mingw64-gcc-c++ mingw64-nsis \
            mingw64-qt6-qtbase
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Build NSIS installer
        run: ./packaging/windows/build.sh --clean
      - name: Check installer identity
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' crates/Cargo.toml | head -1)
          test -s "packaging/windows/build/sterna-$version-x86_64-setup.exe"
          file "packaging/windows/build/sterna-$version-x86_64-setup.exe" |
            grep -F 'PE32+ executable'
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-x86-64
          path: packaging/windows/build/sterna-*-x86_64-setup.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  windows-update-test:
    name: updater lock regression on native Windows
    needs: preflight
    # Qt's official archive below is built with MSVC 2022. Pin the runner too:
    # `windows-latest` moved to VS 2026 and no longer provides this generator.
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: jurplel/install-qt-action@v4
        with:
          # Fedora's 6.11.1 is the release artifact's Qt. The native test uses
          # a widely mirrored official archive: 6.11.1's Windows repository
          # metadata is intermittently absent, and file sharing is a Win32
          # contract rather than a Qt-version verdict.
          version: "6.10.3"
          arch: win64_msvc2022_64
          cache: true
      - name: Ensure assembler is available
        shell: pwsh
        run: |
          # The runner currently exposes a broken Chocolatey shim even when
          # NASM itself is absent. Install unconditionally and put the real
          # directory ahead of that shim for aws-lc-sys's build script.
          choco install nasm --no-progress -y --force
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build updater tests
        shell: pwsh
        run: |
          cmake -S shell -B shell/build-native -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE="$env:GITHUB_WORKSPACE/shell/build-native"
          cmake --build shell/build-native --config Release `
            --target update_test
      - name: Run updater tests
        # `update` contains the native loader-sharing assertion for the
        # downloaded installer. The independent plugin seam is covered by the
        # ordinary Qt shell test suite and is not part of this release gate.
        run: ctest --test-dir shell/build-native -C Release -R "^update$" --output-on-failure

  draft:
    name: assemble draft release
    needs: [linux, windows, windows-update-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-linux-x86-64
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: release-windows-x86-64
          path: release
      - name: Verify exact build output set
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^sterna-\([0-9][0-9.]*\)-x86_64-setup\.exe$/\1/p' < <(find release -maxdepth 1 -type f -printf '%f\n'))
          test -n "$version"
          expected=$(printf '%s\n' \
            sterna-x86_64.AppImage \
            sterna-x86_64.AppImage.zsync \
            "sterna-$version-x86_64-setup.exe" | sort)
          actual=$(find release -maxdepth 1 -type f -printf '%f\n' | sort)
          test "$actual" = "$expected"
          sha256sum release/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Create draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $GITHUB_REF_NAME already exists; refusing to replace its binaries"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --generate-notes \
            --title "Sterna ${GITHUB_REF_NAME#v}"
