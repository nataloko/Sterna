# Runs what exists: the oracle, the Rust core diffed against it, the
# conformance suite, the file-transfer interop suite, and the two Stage 0
# audits.
#
# Two suites are pinned to somebody else's SHA — Tera Term for the oracle, and
# esctest2 for the conformance job — for the same reason in both cases: they
# are the expectation, so tracking a branch would let a commit elsewhere turn
# the gate red with no change on our side.
#
# Everything here builds against a SIBLING CHECKOUT of upstream Tera Term at
# ../teraterm, exactly as the local layout does. That checkout is PINNED to a
# SHA on purpose — the oracle compiles upstream's real sources, so tracking
# their main branch would let an upstream commit break our build with no change
# on our side, and the failure would look like ours. Bump TERATERM_REF
# deliberately, and expect to re-bless goldens when you do.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The fuzz job, and only the fuzz job — see its `if:` below.
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

env:
  # TeraTermProject/teraterm, v5.6.0-496-g827a35b05
  TERATERM_REF: 827a35b050c974b0fdf2a77ef73ed882301eb6c4

jobs:
  oracle:
    name: oracle — Tera Term's VT engine, headless
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: Sterna
      - uses: actions/checkout@v4
        with:
          repository: TeraTermProject/teraterm
          ref: ${{ env.TERATERM_REF }}
          path: teraterm
      # apply_patches.py is a PEP 723 script run via `uv run --script`, so the
      # oracle cannot build without uv. Missing this is why the oracle job was
      # red with "Error 127" from the moment patches were introduced.
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - name: Build
        run: make -C Sterna/oracle
      - name: Regression suite
        run: make -C Sterna/oracle test

  xfer:
    name: xfer — file-transfer protocol interop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: Sterna
      - uses: actions/checkout@v4
        with:
          repository: TeraTermProject/teraterm
          ref: ${{ env.TERATERM_REF }}
          path: teraterm
      - name: Install counterparties
        # G-Kermit, not C-Kermit: C-Kermit sees a pty as a tty and drops into
        # interactive mode instead of speaking the protocol.
        run: sudo apt-get update && sudo apt-get install -y lrzsz gkermit
      - name: Build
        run: make -C Sterna/xfer
      - name: Interop suite
        run: cd Sterna/xfer && ./run_tests.sh

  rust:
    name: rust — audits build and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: serial-audit -> target
      - name: serialport dependency
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      # serial-audit cannot RUN in CI — it needs the FTDI loopback rig — so it
      # is built and linted only. ssh-audit can run: its servers are just
      # sshd and dropbear on localhost.
      - name: Build and lint serial-audit
        run: cd serial-audit && cargo build --locked && cargo clippy -- -D warnings
      - name: Build and lint ssh-audit
        run: cd ssh-audit && cargo build --locked && cargo clippy -- -D warnings

  core:
    name: core — Rust VT engine, diffed against Tera Term
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: Sterna
      - uses: actions/checkout@v4
        with:
          repository: TeraTermProject/teraterm
          ref: ${{ env.TERATERM_REF }}
          path: teraterm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: Sterna/crates -> target
      # tt-conn depends on serialport, which needs libudev to enumerate.
      # Without this the whole core job fails to build, not just tt-conn.
      #
      # The two SSH servers are `ssh-audit`'s, reused: the SSH transport's
      # tests skip loudly without a server, and a green run that quietly
      # exercised none of key exchange, authentication or the pty is exactly
      # the kind of test suite this project does not want.
      - name: Dependencies, and the SSH servers
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev dropbear-bin openssh-server \
              inetutils-telnetd
          cd Sterna/ssh-audit && ./servers.sh start
          cd ../telnet-audit && ./servers.sh start
      - name: Lint
        run: |
          cd Sterna/crates
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
      # tt-conn's serial tests need two ports wired back-to-back and skip
      # without TT_SERIAL_A/TT_SERIAL_B. Only the dev container has the rig,
      # so what runs here is the decoders, the enumeration — and the pty,
      # which is the one transport whose whole suite runs anywhere.
      # This is also where `tt-fuzz` runs: its property tests and its replay of
      # the differential corpus and every committed crash artifact are ordinary
      # stable tests, so they gate every push. The libFuzzer half needs nightly
      # and minutes, and has a job of its own below.
      - name: Unit tests
        run: cd Sterna/crates && cargo test --locked
      # And again with the servers named, which is what turns the eleven
      # skipped SSH cases into eleven that ran. Both servers, because spike 5's
      # second finding was that embedded implementations are narrow in
      # different directions from OpenSSH.
      - name: SSH transport, against OpenSSH and dropbear
        env:
          TT_SSH_HOST: 127.0.0.1
          TT_SSH_PW_USER: sterna-test
          TT_SSH_PASS: spike5-not-a-secret
        run: |
          cd Sterna/crates
          export TT_SSH_USER=$USER
          export TT_SSH_KEY=${XDG_RUNTIME_DIR:-/tmp}/sterna-ssh-audit/id_ed25519
          # One thread: the servers refuse concurrent unauthenticated
          # connections above their own limits (OpenSSH's MaxStartups is
          # 10:30:100, dropbear's is lower), and the refusals look like
          # connection bugs.
          TT_SSH_PORT=2222 cargo test --locked -p tt-conn --test ssh -- --test-threads=1
          TT_SSH_PORT=2223 cargo test --locked -p tt-conn --test ssh -- --test-threads=1
      # The C ABI has to be compiled and linked from C to mean anything: a
      # Rust test never touches the header. This also regenerates it, so the
      # check below is what keeps the committed copy honest — the ABI takes
      # its enums straight from the core crates, and a reordered variant is
      # invisible anywhere else.
      - name: C ABI, from C
        env:
          TT_SSH_HOST: 127.0.0.1
          TT_SSH_PORT: 2222
          TT_TELNET_HOST: 127.0.0.1
          TT_TELNET_PORT: 2323
        run: |
          cd Sterna/crates
          export TT_SSH_USER=$USER
          export TT_SSH_KEY=${XDG_RUNTIME_DIR:-/tmp}/sterna-ssh-audit/id_ed25519
          ./tt-ffi/run_abi.sh
      - name: The committed header matches the source
        run: |
          cd Sterna
          git diff --exit-code -- crates/tt-ffi/include/sterna.h
      # The gate that matters: every case in oracle/cases/ is fed to BOTH the
      # Rust engine and Tera Term's real one, and the two dumps must be
      # identical. No golden files are involved — the oracle is the expectation.
      # A floor, not a baseline. `bench/baseline.json` is the same-machine
      # gate and cannot be enforced from a shared runner — see `bench/README.md`
      # and the note in `tt-bench` on why the number here does not ratchet.
      # What this catches is structural: an accidental quadratic, a per-byte
      # allocation, a scrollback that copies. `--runs 1` because a floor an
      # order of magnitude down does not need the minimum of five.
      - name: Engine throughput, against the floor
        run: cd Sterna/crates && cargo run --release --locked -p tt-bench -- --check --runs 1
      - name: Differential suite vs the oracle
        run: cd Sterna && ./run_diff.sh
      # And the same diff over Tera Term's own escape-sequence exercisers,
      # executed out of the pinned checkout rather than copied into the repo.
      - name: Differential suite over upstream's exercisers
        run: cd Sterna && ./run_upstream.sh
      # Removes the throwaway account the servers created. `always` because a
      # failed test must not leave it behind.
      - name: Telnet transport, against a real telnetd
        env:
          TT_TELNET_HOST: 127.0.0.1
          TT_TELNET_PORT: 2323
          TT_TELNET_RAW_PORT: 2324
        run: cd Sterna/crates && cargo test --locked -p tt-conn --test telnet
      - name: Stop the servers
        if: always()
        run: |
          cd Sterna/ssh-audit && ./servers.sh stop
          cd ../telnet-audit && ./servers.sh stop

  esctest:
    name: esctest — conformance, run inside our own terminal
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
      # tt-host links tt-conn for its pty, and tt-conn needs libudev to build
      # at all. Nothing here touches a serial port.
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      # esctest runs as a program on a pty and reads the terminal's answers
      # back, so this needs no server, no hardware and no display — only the
      # pinned esctest2 checkout, which run_tests.sh fetches by SHA.
      #
      # The gate is drift from `expected`, not a pass rate: a test that starts
      # failing and a test that starts passing are both diffs, because a stale
      # entry must not outlive the thing it describes.
      - name: Conformance suite
        run: cd esctest && ./run_tests.sh

  core-windows:
    name: core — builds and tests on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
      # Only the core: the oracle needs a POSIX toolchain and the differential
      # suite needs the oracle. Native Windows is nevertheless authoritative
      # for ConPTY, COM, named-pipe namespace behavior and the CRT-backed
      # generator check; Wine is only the focused local seam smoke.
      # tt-conn's hardware tests skip without TT_SERIAL_A/B, so they are inert
      # here rather than failing.
      - name: Lint
        run: cd crates; cargo fmt --check && cargo clippy --all-targets --locked -- -D warnings
      - name: Build and test
        run: cd crates; cargo test --locked
      # A Rust test cannot prove a C header or import library. Compile the
      # generated header under MSVC as C11 and C++17, then load the real DLL
      # and drive its Win32 event handles and named-pipe control channel.
      - name: C ABI, from native Windows C and C++
        shell: pwsh
        run: .\crates\tt-ffi\run_abi_windows.ps1
      - name: The committed header matches the source
        run: git diff --exit-code -- crates/tt-ffi/include/sterna.h

  shell:
    name: shell — the Qt frontend, and what it paints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
      # qt6-base-dev is Qt 6.4.2 here and the desktop runs 6.11.1 — a gap that
      # has already produced one false finding, so this job's job is "does it
      # compile and does the painter still agree", NOT anything about
      # behaviour or footprint. Measure those in the sterna-fedora
      # container; see AGENTS.md.
      #
      # fonts-dejavu-core is not decoration: the render test compares a box
      # drawing character against a letter, and a runner with no font carrying
      # U+2500 draws a tofu box that has more ink than either.
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev ninja-build libudev-dev \
              fonts-dejavu-core dropbear-bin openssh-server inetutils-telnetd
          cd ssh-audit && ./servers.sh start
          cd ../telnet-audit && ./servers.sh start
      - name: Build
        run: |
          cd shell
          cmake -S . -B build -G Ninja
          cmake --build build
      # QWidget::grab() renders through the raster engine, so the offscreen
      # platform paints the same pixels a real window would — which is the
      # only reason the painter is testable without a display at all.
      - name: Render tests
        run: cd shell && ./build/render_test
      # The only thing that drives the *window's* event loop against a real
      # server. The core's own SSH tests poll in a busy loop; this is what
      # would notice a QSocketNotifier on the wrong descriptor, or the
      # handover from connection to session losing a wakeup — a window that
      # connects and then shows nothing.
      - name: SSH, through the window's event loop
        env:
          TT_SSH_HOST: 127.0.0.1
          TT_SSH_PORT: 2222
          QT_QPA_PLATFORM: offscreen
        run: |
          cd shell
          export TT_SSH_USER=$USER
          export TT_SSH_KEY=${XDG_RUNTIME_DIR:-/tmp}/sterna-ssh-audit/id_ed25519
          ./build/ssh_test
      - name: Telnet, through the window's event loop
        env:
          TT_TELNET_HOST: 127.0.0.1
          TT_TELNET_PORT: 2323
          QT_QPA_PLATFORM: offscreen
        run: cd shell && ./build/telnet_test
      # The one connection test that skips nothing: a pty needs no server and
      # no hardware, so this runs on every push rather than only where a rig
      # happens to exist.
      - name: A local shell, through the window's event loop
        env:
          QT_QPA_PLATFORM: offscreen
        run: cd shell && ./build/pty_test
      # The other three that need nothing either, and were not gated: a macro
      # against the window's loop, a Tera Term command line from argv to a
      # connected window, and the control socket. `xfer_test` is deliberately
      # still out — it wants `lrzsz`, which this job does not install.
      - name: A macro, through the window's event loop
        env:
          QT_QPA_PLATFORM: offscreen
        run: cd shell && ./build/macro_test
      - name: A command line, from argv to a connected window
        env:
          QT_QPA_PLATFORM: offscreen
        run: cd shell && ./build/cmdline_test
      - name: The control socket, against the window's event loop
        env:
          QT_QPA_PLATFORM: offscreen
        run: cd shell && ./build/control_test
      - name: Stop the servers
        if: always()
        run: |
          cd ssh-audit && ./servers.sh stop
          cd ../telnet-audit && ./servers.sh stop

  # NOT on every push, for two reasons. cargo-fuzz needs nightly, so a bad
  # nightly would turn the gate red with no change on our side — the same
  # reason the oracle and esctest are pinned to a SHA. And a useful fuzz run
  # costs minutes per target, against a push gate that is already a few.
  #
  # What every push *does* get is the other half: `tt-fuzz`'s property tests,
  # and its replay of the corpus and of every crash the fuzzer has ever found,
  # both on stable in the `core` job. The fuzzer explores; that replay is what
  # stops a fixed bug coming back. This job is the exploring, weekly.
  fuzz:
    name: fuzz — libFuzzer over the parser
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates/fuzz -> target
      # tt-fuzz reaches the telnet decoder through tt-conn, which needs libudev
      # to build at all. Nothing here opens a port.
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # Seeded from oracle/cases/, so it starts from 106 streams already aimed
      # at the engine's corners rather than rediscovering that ESC [ introduces
      # a sequence.
      - name: Seed the corpora
        run: cd crates/fuzz && ./seed.sh
      - name: vt_stream
        run: cd crates/fuzz && cargo fuzz run vt_stream -- -max_total_time=600
      - name: vt_chunks
        run: cd crates/fuzz && cargo fuzz run vt_chunks -- -max_total_time=600
      - name: telnet
        run: cd crates/fuzz && cargo fuzz run telnet -- -max_total_time=300
      # The crash file is the whole finding. Without this it dies with the
      # runner and the log has only a byte array to retype by hand.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: crates/fuzz/artifacts/

  ssh-audit:
    name: ssh-audit — russh vs legacy algorithms
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ssh-audit -> target
      - name: Install servers
        run: sudo apt-get update && sudo apt-get install -y dropbear-bin openssh-server
      - name: Run the matrix
        run: |
          cd ssh-audit
          ./servers.sh start
          cargo run --locked
          ./servers.sh stop

# The Windows job covers `crates/` only, and the oracle and xfer both need a
# POSIX toolchain, so neither will ever join it.
#
# The shell is no longer the reason: it cross-builds for Windows out of the
# `sterna-fedora` container against `mingw64-qt6-qtbase` (see shell/README.md),
# which is what proved the source portable. What is missing here is a runner
# with Qt on it — `windows-latest` ships none — so a shell job means an
# installer action and a several-minute download before the first compile.
# That belongs with the release matrix (linux-x64 + windows-x64) and the first
# shippable artifact, which is still the trigger for adding both.
