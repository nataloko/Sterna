[package]
name = "ssh-audit"
version = "0.1.0"
edition = "2021"

[dependencies]
# des: 3des-cbc is feature-gated. dsa: ssh-dss host keys, for completeness.
russh = { version = "0.62", features = ["des", "dsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
